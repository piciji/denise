name: macOS Build

on:
  push:
    branches:
      - 'v*.*'
      - 'v*.*.*'
      - 'test*.*'
  workflow_dispatch:

jobs:
  build-macos-arm:
    runs-on: macos-latest

    env:
      MACOSX_DEPLOYMENT_TARGET: "11"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install build tools
        shell: bash
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install dmgbuild==1.6.7

      - name: Build
        shell: bash
        run: |          
          cmake \
            -B builds/release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_INSTALL_PREFIX=builds/release \
            -DENABLE_LTO=ON
          
          cmake --build builds/release
          cmake --install builds/release
          
          dmgbuild \
            -s data/dmgSettings.py \
            "Denise" \
            builds/release/denise.dmg

      - name: Prepare artifact
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            gzTarget="denise_osx_arm64_${GITHUB_REF_NAME}.dmg"
          else
            gzTarget="denise_osx_arm64_build_${GITHUB_SHA::7}.dmg"
          fi
          
          mv builds/release/denise.dmg "${gzTarget}"
          bzip2 -z "${gzTarget}"
          
          echo "ARTIFACT=${gzTarget}.bz2" >> "${GITHUB_ENV}"

      - name: Upload GitHub Actions artifact
        uses: actions/upload-artifact@v6
        with:
          name: macos-arm-artifact
          path: ${{ env.ARTIFACT }}
          retention-days: 1


  build-macos-intel:
    runs-on: macos-15-intel

    env:
      MACOSX_DEPLOYMENT_TARGET: "10.13"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install build tools
        shell: bash
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install dmgbuild==1.6.7

      - name: Build
        shell: bash
        run: |          
          cmake \
            -B builds/release \
            -DCMAKE_INSTALL_PREFIX=builds/release \
            -DENABLE_LTO=ON
          
          cmake --build builds/release
          cmake --install builds/release
          
          dmgbuild \
            -s data/dmgSettings.py \
            "Denise" \
            builds/release/denise.dmg

      - name: Prepare artifact
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            gzTarget="denise_osx_intel_${GITHUB_REF_NAME}.dmg"
          else
            gzTarget="denise_osx_intel_build_${GITHUB_SHA::7}.dmg"
          fi
          
          mv builds/release/denise.dmg "${gzTarget}"
          bzip2 -z "${gzTarget}"
          
          echo "ARTIFACT=${gzTarget}.bz2" >> "${GITHUB_ENV}"

      - name: Upload GitHub Actions artifact
        uses: actions/upload-artifact@v6
        with:
          name: macos-intel-artifact
          path: ${{ env.ARTIFACT }}
          retention-days: 1

  release:
    needs:
      - build-macos-arm
      - build-macos-intel

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download macOS arm artifact
        uses: actions/download-artifact@v6
        with:
          name: macos-arm-artifact
          path: release

      - name: Download macOS intel artifact
        uses: actions/download-artifact@v6
        with:
          name: macos-intel-artifact
          path: release

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              release/*
          else
            gh release create "nightly ${GITHUB_SHA::7}" \
              --title "nightly ${GITHUB_SHA::7}" \
              --prerelease \
              release/*
          fi

      - name: Install sshpass
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Deploy to SourceForge
        if: github.ref_type == 'tag'
        shell: bash
        env:
          FTP_PSW: ${{ secrets.FTP_PSW }}
          FTP_FOLDER: ${{ secrets.FTP_FOLDER }}
        run: |                    
          printf '%s\n' "${FTP_PSW}" > ftp.txt
          trap 'rm -f ftp.txt' EXIT
          
          for file in release/*; do          
            sshpass -f "ftp.txt" \
              scp \
                -o StrictHostKeyChecking=no \
                -o UserKnownHostsFile=/dev/null \
                "${file}" \
                "piciji@frs.sourceforge.net:${FTP_FOLDER}${GITHUB_REF_NAME}/"
          done

      - name: Clean up
        if: always()
        run: rm -rf release