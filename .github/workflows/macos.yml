name: macOS Build

on:
  push:
    branches:
      - master
      - 'v*.*'
      - 'v*.*.*'
      - 'test*.*'
  pull_request:
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest

    env:
      MACOSX_DEPLOYMENT_TARGET: "11"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install build tools
        shell: bash
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install dmgbuild==1.6.7

      - name: Cache sshpass source
        uses: actions/cache@v4
        with:
          path: sshpass-1.08.tar.gz
          key: sshpass-1.08

      - name: Download sshpass
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          if [ -e sshpass-1.08.tar.gz ]; then
            echo "sshpass exists"
          else
            curl -L \
              "https://onboardcloud.dl.sourceforge.net/project/sshpass/sshpass/1.08/sshpass-1.08.tar.gz" \
              --output sshpass-1.08.tar.gz
          fi
          
          tar -zxf sshpass-1.08.tar.gz

      - name: Build
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            cd sshpass-1.08
            ./configure && make install
            cd ..
          fi
          
          cmake \
            -B builds/release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_INSTALL_PREFIX=builds/release \
            -DENABLE_LTO=ON
          
          cmake --build builds/release
          cmake --install builds/release
          
          dmgbuild \
            -s data/dmgSettings.py \
            "Denise" \
            builds/release/denise.dmg

      - name: Prepare artifact
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            gzTarget="denise_osx_arm64_${GITHUB_REF_NAME}.dmg"
          else
            gzTarget="denise_osx_arm64_build_$(echo "${GITHUB_SHA}" | cut -c 1-7).dmg"
          fi
          
          mv builds/release/denise.dmg "${gzTarget}"
          bzip2 -z "${gzTarget}"
          
          echo "ARTIFACT=${gzTarget}.bz2" >> "${GITHUB_ENV}"

      - name: Upload GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          path: ${{ env.ARTIFACT }}

      - name: Deploy to SourceForge
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          gzTarget="denise_osx_arm64_${GITHUB_REF_NAME}.dmg.bz2"
          
          printf '%s\n' "${{ secrets.FTP_PSW }}" > ftp.txt
          
          trap 'rm -f ftp.txt' EXIT
          
          sshpass -f "ftp.txt" \
            scp \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              "${gzTarget}" \
              "piciji@frs.sourceforge.net:${{ secrets.FTP_FOLDER }}${GITHUB_REF_NAME}/"
