name: Build + Release

on:
  push:
    tags:
      - 'v*.*'
      - 'v*.*.*'
      - 'test*.*'
  workflow_dispatch:

jobs:
  build-macos-arm:
    if: false
    runs-on: macos-latest

    env:
      MACOSX_DEPLOYMENT_TARGET: "11"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install build tools
        shell: bash
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install dmgbuild==1.6.7

      - name: Build
        shell: bash
        run: |          
          cmake \
            -B builds/release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_INSTALL_PREFIX=builds/release \
            -DENABLE_LTO=ON
          
          cmake --build builds/release
          cmake --install builds/release
          
          dmgbuild \
            -s data/dmgSettings.py \
            "Denise" \
            builds/release/denise.dmg

      - name: Prepare artifact
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            gzTarget="denise_osx_arm64_${GITHUB_REF_NAME}.dmg"
          else
            gzTarget="denise_osx_arm64_build_${GITHUB_SHA::7}.dmg"
          fi
          
          mv builds/release/denise.dmg "${gzTarget}"
          bzip2 -z "${gzTarget}"
          
          echo "ARTIFACT=${gzTarget}.bz2" >> "${GITHUB_ENV}"

      - name: Upload GitHub Actions artifact
        uses: actions/upload-artifact@v6
        with:
          name: macos-arm-artifact
          path: ${{ env.ARTIFACT }}
          retention-days: 1


  build-macos-intel:
    if: false
    runs-on: macos-15-intel

    env:
      MACOSX_DEPLOYMENT_TARGET: "10.13"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install build tools
        shell: bash
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install dmgbuild==1.6.7

      - name: Build
        shell: bash
        run: |          
          cmake \
            -B builds/release \
            -DCMAKE_INSTALL_PREFIX=builds/release \
            -DENABLE_LTO=ON
          
          cmake --build builds/release
          cmake --install builds/release
          
          dmgbuild \
            -s data/dmgSettings.py \
            "Denise" \
            builds/release/denise.dmg

      - name: Prepare artifact
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            gzTarget="denise_osx_intel_${GITHUB_REF_NAME}.dmg"
          else
            gzTarget="denise_osx_intel_build_${GITHUB_SHA::7}.dmg"
          fi
          
          mv builds/release/denise.dmg "${gzTarget}"
          bzip2 -z "${gzTarget}"
          
          echo "ARTIFACT=${gzTarget}.bz2" >> "${GITHUB_ENV}"

      - name: Upload GitHub Actions artifact
        uses: actions/upload-artifact@v6
        with:
          name: macos-intel-artifact
          path: ${{ env.ARTIFACT }}
          retention-days: 1

  build-windows:
    runs-on: windows-latest

    strategy:
      matrix:
        include:
          - target: win64
            mingw_archive: x86_64-14.2.0-release-posix-seh-msvcrt-rt_v12-rev2.7z
            mingw_dir: mingw64

          - target: win32
            mingw_archive: i686-14.2.0-release-posix-dwarf-msvcrt-rt_v12-rev2.7z
            mingw_dir: mingw32

    env:
      mingw_archive: ${{ matrix.mingw_archive }}
      mingw_dir: ${{ matrix.mingw_dir }}
      mingw_url: https://github.com/niXman/mingw-builds-binaries/releases/download/14.2.0-rt_v12-rev2/${{ matrix.mingw_archive }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Cache MinGW archive
        id: cache-mingw
        uses: actions/cache@v4
        with:
          path: ${{ env.mingw_archive }}
          key: mingw-${{ env.mingw_archive }}

      - name: Download MinGW
        if: steps.cache-mingw.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          curl -L "%mingw_url%" -o "%mingw_archive%"

      - name: Extract MinGW
        shell: cmd
        run: |
          7z x -y "%mingw_archive%" > nul
          
      - name: Setup MinGW
        shell: cmd
        run: |
          echo %CD%\%mingw_dir%\bin>>"%GITHUB_PATH%"
          g++ -v          

      - name: Build
        shell: cmd
        run: |
          cmake -G "MinGW Makefiles" -B builds/release -DENABLE_LTO=ON
          cmake --build builds/release
          cmake --install builds/release

      - name: Prepare artifact
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            zipTarget="denise_${{ matrix.target }}_${GITHUB_REF_NAME}"
          else
            zipTarget="denise_${{ matrix.target }}_build_${GITHUB_SHA::7}"
          fi

          mv builds/release/out "${zipTarget}"
          zip -r "${zipTarget}.zip" "${zipTarget}"

          echo "ARTIFACT=${zipTarget}.zip" >> "${GITHUB_ENV}"

      - name: Upload GitHub Actions artifact
        uses: actions/upload-artifact@v6
        with:
          name: macos-${{ matrix.target }}-artifact
          path: ${{ env.ARTIFACT }}
          retention-days: 1

  release:
    needs:
     # - build-macos-arm
     # - build-macos-intel
      - build-windows

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download macOS arm artifact
        uses: actions/download-artifact@v7
        with:
          name: macos-arm-artifact
          path: release

      - name: Download macOS intel artifact
        uses: actions/download-artifact@v7
        with:
          name: macos-intel-artifact
          path: release

      - name: Create GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |          
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "" \
            release/*

      - name: Install sshpass
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Deploy to SourceForge
        shell: bash
        env:
          FTP_PSW: ${{ secrets.FTP_PSW }}
          FTP_FOLDER: ${{ secrets.FTP_FOLDER }}
        run: |                    
          printf '%s\n' "${FTP_PSW}" > ftp.txt
          trap 'rm -f ftp.txt' EXIT
          
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            DEST_FOLDER="${GITHUB_REF_NAME}"
          else
            DEST_FOLDER="nightlies"
          fi
          
          for file in release/*; do          
            sshpass -f "ftp.txt" \
              scp \
                -o StrictHostKeyChecking=no \
                -o UserKnownHostsFile=/dev/null \
                "${file}" \
                "piciji@frs.sourceforge.net:${FTP_FOLDER}${DEST_FOLDER}/"
          done

      - name: Clean up
        if: always()
        run: rm -rf release