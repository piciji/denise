id: org.bitbucket.Denise
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: denise
rename-desktop-file: denise.desktop
rename-icon: denise
rename-appdata-file: denise.appdata.xml

modules:
  - name: denise
    buildsystem: cmake
    config-opts:
      - -DENABLE_LTO=ON
    builddir: true
    sources:
      - type: dir
        path: ../

finish-args:
  - --socket=x11
  - --share=ipc
  - --device=all
  - --socket=pulseaudio
  - --filesystem=host:rw


