
branches:
  only:
    - master
    - /v\d*\.\d*/
    - /v\d*\.\d*\.\d*/
    - harddisk

language: generic
dist: focal
os: linux

before_install:
  - sudo apt-get -q update

addons:
  apt:
    packages:
      - g++-10
      - cmake
      - mesa-common-dev
      - libgtk-3-dev
      - libpulse-dev
      - libudev-dev
      - libxcb-xinput-dev
      - libxcb-xfixes0
      - sshpass      
      - flatpak-builder

jobs:
  include:
    - name: Flatpak
      compiler: gcc
      script:
      - flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - flatpak-builder --force-clean --user --install-deps-from=flathub --repo=repo .flatpak-builder/out data/org.bitbucket.Denise.yml
      - flatpak build-bundle repo denise.flatpak org.bitbucket.Denise --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo
      - |
        if [ -z "$TRAVIS_TAG" ]; then
          export deployFile=denise_$(echo ${TRAVIS_COMMIT} | cut -c 1-7).flatpak
          export deployTarget=${FTP_NIGHTLIES}
        else
          export deployFile=denise_${TRAVIS_TAG}.flatpak
          export deployTarget=${FTP_TAGS}
        fi
      - mv denise.flatpak "${deployFile}"


    - name: DEB package    
      compiler: gcc
      script:
      - cmake -B builds/release -DCMAKE_CXX_COMPILER=g++-10 || travis_terminate 1;
      - cmake --build builds/release -j 4 || travis_terminate 1;
      - cd data
      - chmod +x build_deb.sh
      - ./build_deb.sh
      - dpkg-deb --build ./denisepackage || travis_terminate 1;
      - |
        if [ -z "$TRAVIS_TAG" ]; then
          export deployFile=denise_ubuntu2004_$(echo ${TRAVIS_COMMIT} | cut -c 1-7).deb
          export deployTarget=${FTP_NIGHTLIES}
        else
          export deployFile=denise_ubuntu2004_${TRAVIS_TAG}.deb
          export deployTarget=${FTP_TAGS}
        fi
      - mv denisepackage.deb "${deployFile}"

after_success:
  - echo ${FTP_PSW} > ftp.txt 2>&1

deploy:
  provider: script
  script: sshpass -f "ftp.txt" scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "${deployFile}" piciji@frs.sourceforge.net:"${deployTarget}"
  edge: true
  on:
    all_branches: true


# hint for env FTP_FOLDER: v\\\ 1.0