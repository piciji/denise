
branches:
  only:
    - master
    - /v\d*\.\d*/
    - /v\d*\.\d*\.\d*/
    - travis_integration

language: generic
dist: focal

jobs:
  include:
    - compiler: gcc

before_install:
  - sudo apt-get -q update

addons:
  apt:
    packages:
      - g++-10
      - cmake
      - mesa-common-dev
      - libgtk-3-dev
      - libpulse-dev
      - libudev-dev
      - libxcb-xinput-dev
      - libxcb-xfixes0
      - sshpass

script:
  - cmake -B builds/release -DCMAKE_CXX_COMPILER=g++-10 || travis_terminate 1;
  - cmake --build builds/release -j 4 || travis_terminate 1;
  - cd data
  - chmod +x build_deb.sh
  - ./build_deb.sh
  - dpkg-deb --build ./denisepackage || travis_terminate 1;
  - |
    if [ -z "$TRAVIS_TAG" ]; then
      export debFile=denise_ubuntu2004_$(echo ${TRAVIS_COMMIT} | cut -c 1-7).deb
      export debTarget=${FTP_NIGHTLIES}
    else
      export debFile=denise_ubuntu2004_${TRAVIS_TAG}.deb
      export debTarget=${FTP_TAGS}
    fi
  - mv denisepackage.deb "${debFile}"

after_success:
  - echo ${FTP_PSW} > ftp.txt 2>&1


deploy:
  skip_cleanup: true
  provider: script
  script: sshpass -f "ftp.txt" scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "${debFile}" piciji@frs.sourceforge.net:"${debTarget}"
  edge: true
  on:
    branch: travis_integration

# hint for env FTP_FOLDER: v\\\ 1.0