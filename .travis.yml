
branches:
  only:
    - master
    - /v\d*\.\d*/
    - /v\d*\.\d*\.\d*/
    - travis_integration

language: generic
dist: focal

jobs:
  include:
    - compiler: gcc

before_install:
  - sudo apt-get -q update

addons:
  apt:
    packages:
      - g++-12
      - cmake
      - mesa-common-dev
      - libgtk-3-dev
      - libopenal-dev
      - libpulse-dev
      - libudev-dev
      - libxcb-xinput-dev
      - libxcb-xfixes0
      - sshpass

script:
  - cmake -B builds/release || travis_terminate 1;
  - cmake --build builds/release -j 2 || travis_terminate 1;
  - cd data
  - chmod +x build_deb.sh
  - ./build_deb.sh
  - dpkg-deb --build ./denisepackage || travis_terminate 1;
  - tar -zcf denisepackage.tar.gz denisepackage.deb

deploy:
  provider: script
  script:
    - |
      export gzTarget=denisepackage.tar.gz
# todo
  on:
    tags: false