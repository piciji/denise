
version: '{build}'

skip_commits:
  files:
    - data/*
    - '**/*.md'

cache:
  - x86_64-8.1.0-release-posix-seh-rt_v6-rev0.7z
  - i686-8.1.0-release-posix-dwarf-rt_v6-rev0.7z

image:
  - Visual Studio 2019

environment:
  matrix:
    - MINGW_DIR: mingw64
      WINDOWS: win64
      MINGW_URL: https://sourceforge.net/projects/mingw-w64/files/Toolchains%20targetting%20Win64/Personal%20Builds/mingw-builds/8.1.0/threads-posix/seh/x86_64-8.1.0-release-posix-seh-rt_v6-rev0.7z
      MINGW_ARCHIVE: x86_64-8.1.0-release-posix-seh-rt_v6-rev0.7z
      MINGW_LIBS: '%MINGW_DIR%\bin\x86_64-w64-mingw32' 
    - MINGW_DIR: mingw32
      WINDOWS: win32
      MINGW_URL: https://sourceforge.net/projects/mingw-w64/files/Toolchains%20targetting%20Win32/Personal%20Builds/mingw-builds/8.1.0/threads-posix/dwarf/i686-8.1.0-release-posix-dwarf-rt_v6-rev0.7z
      MINGW_ARCHIVE: i686-8.1.0-release-posix-dwarf-rt_v6-rev0.7z
      MINGW_LIBS:  '%MINGW_DIR%\bin\i686-w64-mingw32'
install:
  - if not exist "%MINGW_ARCHIVE%" appveyor DownloadFile "%MINGW_URL%" -FileName "%MINGW_ARCHIVE%"
  - 7z x -y "%MINGW_ARCHIVE%" > nul
  
before_build:
  - set Path=%CD%\%MINGW_DIR%\bin;%Path%     
  - cmd: xcopy /I /Y "data\libs\include" "%MINGW_LIBS%\include"
  - cmd: xcopy /I /Y "data\libs\shared\%WINDOWS%\OpenAL32.lib" "%MINGW_LIBS%\lib\OpenAL32.lib"
  - cmd: xcopy /I /Y "data\libs\static\%WINDOWS%\libfreetype.a" "%MINGW_LIBS%\lib\libfreetype.a"
  
build_script:
  - cmd: C:\MinGW\msys\1.0\bin\bash -c "cd C:/projects/denise && make && make install"
  
artifacts:
  - path: out
    name: Denise_dev_{build}
    type: zip